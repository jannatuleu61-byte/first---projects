<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Your custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard d-flex">

        <!-- Sidebar  -->
        <aside class="dashboard-sidebar p-3">
            <h2 class="dashboard-heading">
                <a href="/" class="home-link" aria-label="Go to Home">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3.293l6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293l6-6zm5 6.414V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V9.707l5-5 5 5z"/>
                    <path fill-rule="evenodd" d="M7.293 1.5a1 1 0 0 1 1.414 0l6 6a1 1 0 0 1-1.414 1.414L8 3.914 2.707 8.914A1 1 0 0 1 1.293 7.5l6-6z"/>
                </svg>
                </a>
                Dashboard Menu
            </h2>

            <ul class="list-unstyled">
                
                <li>
                    <span>Manage Books</span>
                    <ul class="list-unstyled pl-3">
                        <li><a href="./pages/books/create-book.html">Create Book</a></li>
                        <li><a href="./pages//books/view-books.html">View Books</a></li>
                    </ul>
                </li>
                <li>
                    <span>User Accounts</span>
                    <ul class="list-unstyled pl-3">
                        <li><a href="./pages/users/create-user.html">Create User</a></li>
                        <li><a href="./pages/users/view-users.html">View Users</a></li>
                    </ul>
                </li>
                <li>
                    <span>Student Accounts</span>
                    <ul class="list-unstyled pl-3">
                        <li><a href="./pages/students/create-student.html">Create Student</a></li>
                        <li><a href="./pages/students/view-students.html">View Students</a></li>
                    </ul>
                </li>
                
            </ul>
        </aside>
        <!-- Dashboard Main  -->
        <main class="dashboard-main flex-grow-1">
            <div class="dashboard-main-nav">
                <nav class="p-3">
                    <ul class="d-flex justify-content-between align-items-center list-unstyled">
                        <li>
                            <a href="#" class="hamburger" aria-label="Open menu">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <rect y="4" width="24" height="2" rx="1" fill="currentColor"/>
                                    <rect y="11" width="24" height="2" rx="1" fill="currentColor"/>
                                    <rect y="18" width="24" height="2" rx="1" fill="currentColor"/>
                                </svg>
                            </a>
                        </li>
                        
                        <li>
                            <span style="display: flex; align-items: center;">
                                <span style="margin-right: 10px; font-weight: 500;">John Doe</span>
                                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile Picture" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            </span>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="dashboard-container p-3">
                
                <!-- Page Header -->
                <section class="page-header">
                    <h1>Edit Profile</h1>
                    <p>Update your personal information below.</p>
                </section>

                <!-- Edit Profile Form -->
                <section class="profile-form">
                    <form action="/update-profile" method="POST">
                        <!-- Name -->
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" value="Jane Doe" required>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" value="jane.doe@example.com" required>
                        </div>

                        <!-- Bio -->
                        <div class="form-group">
                            <label for="bio">Short Bio</label>
                            <textarea id="bio" name="bio" rows="4">Lover of timeless classics and modern literature.</textarea>
                        </div>

                        <!-- Favorite Genre -->
                        <div class="form-group">
                            <label for="genre">Favorite Genre</label>
                            <select id="genre" name="genre">
                                <option>Historical Fiction</option>
                                <option>Fantasy</option>
                                <option>Classics</option>
                                <option>Poetry</option>
                                <option>Non-fiction</option>
                            </select>
                        </div>

                        <!-- Currently Reading -->
                        <div class="form-group">
                            <label for="current">Currently Reading</label>
                            <input type="text" id="current" name="current" value="Pride and Prejudice by Jane Austen">
                        </div>

                        <!-- Buttons -->
                        <div class="form-actions">
                            <button type="submit" class="btn-edit">Save Changes</button>
                            <a href="profile.html" class="btn-delete">Cancel</a>
                        </div>
                    </form>
                </section>

        </main>

    </div>

    <script src="./js/main.js"></script>

</body>
</html>
